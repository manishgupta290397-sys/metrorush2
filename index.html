<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>METRO RUSH — endless runner</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17140f; --paper:#f6efe0; --yellow:#ffc21c; --red:#e5472e;
  --teal:#1f9e8e; --sky:#9fd8dd; --dia:#4fc3ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  position:fixed;inset:0;
  font-family:'Space Grotesk',sans-serif;background:var(--sky);color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
body.tab-hidden *{animation-play-state:paused!important}
#boardList,.char-grid,.panel{scrollbar-width:none;-ms-overflow-style:none}
#boardList::-webkit-scrollbar,.char-grid::-webkit-scrollbar,.panel::-webkit-scrollbar{display:none;width:0;height:0}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.icon{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em}

/* ---------- error overlay ---------- */
#fatalWrap{position:fixed;inset:0;z-index:9999;display:none;align-items:center;
  justify-content:center;background:rgba(23,20,15,.88);padding:20px}
#fatalWrap.show{display:flex}
.fatal-panel{background:var(--paper);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);
  padding:26px 24px;width:min(92vw,470px);text-align:center;transform:rotate(-.6deg)}
.fatal-title{font-family:Bungee;font-size:1.5rem;color:var(--red);margin-bottom:12px;
  text-shadow:.08em .08em 0 var(--ink);transform:rotate(-1deg)}
#fatalText{font-weight:700;line-height:1.5;background:var(--ink);color:var(--yellow);
  padding:12px 14px;margin-bottom:14px;word-break:break-word;text-align:left;
  font-family:monospace;font-size:.8rem}
.fatal-hint{font-weight:700;font-size:.74rem;opacity:.75;line-height:1.5;margin-bottom:16px}

/* ---------- popup modal ---------- */
#modalWrap{position:fixed;inset:0;z-index:60;display:none;align-items:center;
  justify-content:center;background:rgba(23,20,15,.6);padding:20px}
#modalWrap.show{display:flex}
#modalWrap .panel{width:min(92vw,400px);text-align:center}
#mTitle{font-family:Bungee;font-size:1.3rem;transform:rotate(-1deg);margin-bottom:8px}
#mText{font-weight:700;font-size:.9rem;line-height:1.5;margin-bottom:16px;opacity:.85}
.m-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- mystery box opening stage ---------- */
#boxWrap{position:fixed;inset:0;z-index:55;display:none;align-items:center;
  justify-content:center;background:rgba(23,20,15,.82);padding:20px}
#boxWrap.show{display:flex}
.box-stage{background:var(--paper);border:4px solid var(--ink);box-shadow:12px 12px 0 var(--ink);
  padding:30px 26px 26px;width:min(92vw,400px);text-align:center;transform:rotate(-.6deg);
  animation:panIn .26s cubic-bezier(.2,1.4,.4,1)}
#boxCount{font-family:Bungee;font-size:.8rem;letter-spacing:.14em;margin-bottom:14px;
  display:inline-block;background:var(--ink);color:var(--yellow);padding:.4em .9em;
  transform:rotate(-1.5deg)}
#boxArtWrap{height:210px;display:flex;align-items:center;justify-content:center;margin:4px 0 10px}
#boxArt{width:190px;height:190px}
#boxArt.shaking{animation:boxShake .95s ease-in-out}
@keyframes boxShake{
  0%,100%{transform:rotate(0) translateY(0)}
  10%{transform:rotate(-5deg) translateY(-8px)}20%{transform:rotate(5deg)}
  30%{transform:rotate(-6deg) translateY(-12px)}40%{transform:rotate(6deg)}
  50%{transform:rotate(-4deg) translateY(-8px)}60%{transform:rotate(4deg)}
  70%{transform:rotate(-3deg)}80%{transform:rotate(3deg) translateY(-5px)}90%{transform:rotate(-1deg)}}
#boxReveal{height:210px;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;margin:4px 0 10px}
#boxReveal.rwpop{animation:rwIn .55s cubic-bezier(.2,1.7,.4,1)}
@keyframes rwIn{0%{transform:scale(.3) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
#rvIcon{width:110px;height:110px}
#rvIcon svg{width:100%;height:100%}
#rvText{font-family:Bungee;font-size:1.35rem;transform:rotate(-1.5deg)}
#rvSub{font-weight:700;font-size:.75rem;opacity:.7}
.openPulse{animation:openPulse 1.3s ease-in-out infinite}
@keyframes openPulse{
  0%,100%{transform:skewX(-6deg) scale(.92)}
  50%{transform:skewX(-6deg) scale(1.14)}}
#boxOpenBtn{font-size:1.35rem;padding:.5em 2em}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;z-index:10}
.screen.active{display:flex;animation:scrIn .2s ease-out}
.screen.dim{background:rgba(23,20,15,.55)}
@keyframes scrIn{from{opacity:0}to{opacity:1}}

/* ---------- HUD ---------- */
#scr-hud{pointer-events:none;z-index:5}
.hud-left{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));
  left:calc(14px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.chip{background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:.24em .75em;transform:skewX(-8deg)}
.chip-in{display:flex;align-items:center;gap:.5em;transform:skewX(8deg)}
#chipScore{font-family:Bungee;font-size:clamp(1.25rem,4.5vw,1.7rem)}
#chipCoins,#chipDia{font-weight:700;font-size:1.05rem}
#chipCoins .icon{color:var(--yellow)}
#chipDia .icon{color:var(--dia)}
#btnPause{pointer-events:auto;position:absolute;top:calc(14px + env(safe-area-inset-top,0px));
  right:calc(14px + env(safe-area-inset-right,0px));width:56px;height:56px;
  background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
#btnPause:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
#pwStack{position:absolute;top:calc(84px + env(safe-area-inset-top,0px));
  right:calc(14px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;
  gap:8px;align-items:flex-end;pointer-events:none;z-index:6}
.chip.pw{padding:.2em .55em}
.chip.pw .chip-in{gap:.45em}
.pwi{width:1.3em;height:1.3em;display:inline-flex;color:var(--pc,#17140f)}
.pwi svg{width:100%;height:100%}
.pwbar{display:block;width:52px;height:8px;border:2px solid var(--ink);background:rgba(23,20,15,.15)}
.pwbar b{display:block;height:100%;background:var(--pc,#17140f);width:100%}
.chip.pw.low{animation:pwLow .4s steps(2) infinite}
@keyframes pwLow{50%{border-color:var(--red);box-shadow:4px 4px 0 var(--red)}}
#announce{position:absolute;top:32%;left:0;right:0;text-align:center;font-family:Bungee;
  font-size:clamp(2.6rem,10vw,4.8rem);color:var(--paper);text-shadow:.09em .09em 0 var(--ink);
  opacity:0;pointer-events:none;transform:rotate(-2deg)}
#announce.pop{animation:ann .85s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes ann{0%{opacity:0;transform:scale(1.9) rotate(-5deg)}16%{opacity:1;transform:scale(1) rotate(-2deg)}
  72%{opacity:1}100%{opacity:0;transform:scale(.94) rotate(-2deg)}}
.pop{animation:pp .3s cubic-bezier(.2,1.8,.3,1)!important}
@keyframes pp{0%{transform:skewX(-8deg) scale(1.3)}100%{transform:skewX(-8deg) scale(1)}}
#flash{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:9}
#flash.go{animation:fl .5s ease-out forwards}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}

/* ---------- menu ---------- */
#scr-menu{flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px))
          calc(18px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px))}
.menu-top{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
.menu-top .leftgrp{display:flex;gap:9px;flex-wrap:wrap}
.menu-top .rightgrp{display:flex;gap:9px}
.chip.tappable{cursor:pointer}
.chip.tappable:active{transform:skewX(-8deg) translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip .editic{width:.85em;height:.85em;opacity:.55;display:inline-flex}
.title-wrap{text-align:center;margin-top:2vh}
.logo{font-family:Bungee;font-size:clamp(3rem,12vw,6.4rem);line-height:.92;color:var(--paper);
  text-shadow:.085em .085em 0 var(--ink);transform:rotate(-2deg)}
.logo .accent{color:var(--yellow)}
.menu-actions{display:flex;flex-direction:column;gap:13px;align-items:center;margin-bottom:52px}
.btn{font-family:Bungee;border:3.5px solid var(--ink);cursor:pointer;color:var(--ink);
  background:var(--paper);box-shadow:5px 5px 0 var(--ink);transform:skewX(-6deg);
  transition:transform .08s,box-shadow .08s}
.btn>*{display:inline-flex;align-items:center;gap:.5em;transform:skewX(6deg)}
.btn:hover{transform:skewX(-6deg) translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:skewX(-6deg) translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px dashed var(--red);outline-offset:3px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{font-size:clamp(1.25rem,4.5vw,1.6rem);background:var(--yellow);padding:.5em 1.6em}
.btn-mid{font-size:1rem;padding:.55em 1.2em}
.btn-dia{background:var(--dia)}
.menu-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.shakeCard{animation:shakeX .3s}
@keyframes shakeX{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#pendingRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
#pendingRow:empty{display:none}
#pendingRow .pendlbl{font-weight:700;font-size:.7rem;letter-spacing:.14em;opacity:.7}
.pend{font-weight:700;font-size:.72rem;letter-spacing:.05em;border:2.5px solid var(--ink);
  background:var(--paper);box-shadow:3px 3px 0 var(--ink);padding:.3em .6em;
  display:inline-flex;align-items:center;gap:.4em;transform:skewX(-6deg)}
.pend svg{width:1em;height:1em}

/* ---------- panels ---------- */
.panel-wrap{align-items:center;justify-content:center}
.panel{position:relative;background:var(--paper);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);
  padding:24px 26px;width:min(92vw,440px);transform:rotate(-.6deg);animation:panIn .26s cubic-bezier(.2,1.4,.4,1)}
@keyframes panIn{from{transform:rotate(-.6deg) scale(.9);opacity:0}to{transform:rotate(-.6deg) scale(1);opacity:1}}
.panel h2{font-family:Bungee;font-size:1.55rem;margin-bottom:8px;transform:rotate(-.5deg)}
.panel-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.panel-head h2{margin-bottom:0;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;
  border-bottom:2px dashed rgba(23,20,15,.28)}
.row:last-child{border-bottom:0}
.row .lbl{font-weight:700;letter-spacing:.04em}
.switch{width:58px;height:30px;border:3px solid var(--ink);background:var(--paper);position:relative;
  cursor:pointer;box-shadow:3px 3px 0 var(--ink);flex:none}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--ink);transition:left .14s}
.switch.on{background:var(--yellow)}
.switch.on .knob{left:30px}

/* ---------- name editor ---------- */
#nameInput{width:100%;font-family:Bungee;font-size:1.35rem;text-align:center;letter-spacing:.06em;
  border:3.5px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);
  padding:.45em .5em;margin:6px 0 0;outline:none;color:var(--ink);text-transform:uppercase}
#nameInput:focus{border-color:var(--teal)}

/* ---------- players ---------- */
#scr-players .panel{max-height:92vh;overflow-y:auto}
.players-body{display:flex;flex-direction:column;gap:12px;margin-top:6px;min-height:0}
.pv-host{position:relative;height:205px;flex:none;border:3px solid var(--ink);
  background:#e8dcbf;overflow:hidden;touch-action:none}
.pv-host canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.pv-host canvas:active{cursor:grabbing}
.pv-hint{position:absolute;top:7px;left:9px;font-size:.62rem;font-weight:700;
  letter-spacing:.1em;opacity:.55;pointer-events:none}
#pvName{position:absolute;bottom:7px;left:9px;font-family:Bungee;font-size:.85rem;pointer-events:none}
#pvLock{position:absolute;top:7px;right:9px;font-family:Bungee;font-size:.66rem;color:var(--paper);
  background:var(--ink);padding:.3em .55em;transform:rotate(2deg);display:none;pointer-events:none}
#pvMsg{position:absolute;bottom:7px;right:9px;font-family:Bungee;font-size:.72rem;color:var(--red);
  opacity:0;transition:opacity .25s;pointer-events:none;text-align:right}
#pvMsg.show{opacity:1}
.char-col{min-height:0;display:flex;flex-direction:column}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:10px;overflow-y:auto;max-height:40vh;padding:2px;touch-action:pan-y;
  -webkit-overflow-scrolling:touch}
.ccard{position:relative;border:3px solid var(--ink);background:var(--paper);box-shadow:4px 4px 0 var(--ink);
  padding:11px 5px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.ccard:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.ccard.sel{background:var(--yellow)}
.ccard.lock .cav{filter:grayscale(.85) brightness(.92)}
.ccard .cav{width:52px;height:52px;display:block}
.ccard .cav svg{width:100%;height:100%}
.ccard .cname{font-family:Bungee;font-size:.72rem;color:var(--ink);letter-spacing:.02em}
.ccard .cuse{position:absolute;top:-11px;right:-8px;background:var(--ink);color:var(--yellow);
  font-family:Bungee;font-size:.55rem;padding:.3em .55em;transform:rotate(6deg)}
.ccard .pricechip{font-size:.62rem;font-weight:700;display:inline-flex;gap:.3em;align-items:center;
  border:2px solid var(--ink);padding:.14em .45em;background:#fff}
.ccard .pricechip svg{width:.8em;height:.8em;color:#b8860b}
.ccard .lockic{position:absolute;top:-9px;left:-8px;width:21px;height:21px;color:var(--paper);
  background:var(--ink);border-radius:50%;padding:3.5px;box-shadow:2px 2px 0 rgba(23,20,15,.25)}
.ccard .lockic svg{width:100%;height:100%;display:block}
@media (orientation:landscape){
  #scr-players .panel{width:min(92vw,880px)}
  .players-body{flex-direction:row;align-items:stretch}
  .char-col{order:-1;flex:0 0 46%;max-height:60vh}
  .char-grid{max-height:none;flex:1;min-height:0}
  .pv-host{flex:1;height:auto;min-height:300px}
}

/* ---------- leaderboard ---------- */
#scr-board .panel{max-height:92vh;overflow-y:auto}
#boardList{max-height:56vh;overflow-y:auto;margin-top:4px;touch-action:pan-y;
  -webkit-overflow-scrolling:touch}
.brow{display:flex;align-items:center;gap:12px;padding:11px 8px;
  border-bottom:2px dashed rgba(23,20,15,.28);font-weight:700}
.brow:last-child{border-bottom:0}
.brow .rk{font-family:Bungee;width:2.1em;font-size:.95rem}
.brow .nm{flex:1;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .sc{font-variant-numeric:tabular-nums;font-size:.95rem}
.brow.r1 .rk{color:#b8860b}.brow.r2 .rk{color:#7a8288}.brow.r3 .rk{color:#a5622d}
.brow.me{background:var(--yellow);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  padding:11px;margin:4px 0;transform:skewX(-3deg)}
.brow.me .nm{font-family:Bungee;font-size:.82rem}
#boardMsg{font-weight:700;font-size:.85rem;text-align:center;padding:22px 10px;line-height:1.6;opacity:.85;
  white-space:pre-line}

/* ---------- game over ---------- */
#scr-over .panel{text-align:center}
#overTitle{font-family:Bungee;font-size:clamp(2.2rem,9vw,3rem);color:var(--red);
  text-shadow:.09em .09em 0 var(--ink);transform:rotate(-2deg)}
#overLine{font-weight:700;font-size:.85rem;letter-spacing:.06em;margin:8px 0 14px}
#overScore{font-family:Bungee;font-size:2.5rem;line-height:1;background:var(--yellow);
  border:3.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:.25em .5em;
  display:inline-block;transform:skewX(-6deg)}
#overScore span{display:inline-block;transform:skewX(6deg)}
.stat{display:flex;justify-content:space-between;font-weight:700;padding:9px 4px;
  border-bottom:2px dashed rgba(23,20,15,.28);font-variant-numeric:tabular-nums}
.stat .icon{filter:drop-shadow(1.5px 1.5px 0 var(--ink))}
.stat .ic-coin{color:var(--yellow)}
.stat .ic-dia{color:var(--dia)}
#bestBadge{position:absolute;top:-16px;right:-12px;background:var(--yellow);border:3px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);font-family:Bungee;font-size:.85rem;padding:.35em .7em;
  transform:rotate(7deg);animation:badgePop .5s cubic-bezier(.2,1.8,.4,1);display:none}
#bestBadge.show{display:block}
@keyframes badgePop{0%{transform:rotate(7deg) scale(0)}100%{transform:rotate(7deg) scale(1)}}
.over-actions{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<!-- ============ ERROR OVERLAY ============ -->
<div id="fatalWrap">
  <div class="fatal-panel">
    <div class="fatal-title" id="fatalTitle">GAME ERROR</div>
    <div id="fatalText">—</div>
    <div class="fatal-hint" id="fatalHint">Press RETRY to reload. If it repeats, screenshot this message and report it.</div>
    <button class="btn btn-primary" id="fatalRetry"><span>↻ RETRY</span></button>
  </div>
</div>

<!-- ============ POPUP MODAL ============ -->
<div id="modalWrap">
  <div class="panel">
    <div id="mTitle">—</div>
    <div id="mText">—</div>
    <div class="m-btns" id="mBtns"></div>
  </div>
</div>

<!-- ============ MYSTERY BOX OPENING ============ -->
<div id="boxWrap">
  <div class="box-stage">
    <span id="boxCount">MYSTERY BOX</span>
    <div id="boxArtWrap">
      <svg id="boxArt" viewBox="0 0 120 120" aria-hidden="true">
        <rect x="14" y="36" width="92" height="70" rx="5" fill="#e0a13c" stroke="#17140f" stroke-width="5"/>
        <rect x="14" y="66" width="92" height="14" fill="#e5472e" stroke="#17140f" stroke-width="4"/>
        <rect x="51" y="36" width="18" height="70" fill="#e5472e" stroke="#17140f" stroke-width="4"/>
        <rect x="10" y="24" width="100" height="16" rx="4" fill="#ffc21c" stroke="#17140f" stroke-width="5"/>
        <path d="M60 24 46 10q8-6 14 0 6
